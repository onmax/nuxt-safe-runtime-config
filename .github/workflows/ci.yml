name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Git ref to verify
        required: false
        type: string

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || github.sha }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm dev:prepare
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: Test startup on Nuxt 4.7 with Nitro 3
        run: |
          app=$(mktemp -d)
          cp -R test/fixtures/nuxt-4.7-nitro-3/. "$app"
          pnpm pack --pack-destination "$app"
          (cd "$app" && npm init -y && npm install nuxt@4.7.0 nitro@3.0.261103-rc zod@4.6.7 ./nuxt-safe-runtime-config-*.tgz)
          NUXT_47_TEST_APP="$app" pnpm exec vitest run test/nuxt-4.7.test.ts
