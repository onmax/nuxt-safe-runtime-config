minimumReleaseAgeExcludePrune: true

trustPolicy: no-downgrade
trustPolicyExclude:
  # Babel still uses semver 6, whose releases predate npm provenance.
  - semver@6.3.1

shellEmulator: true

packages:
  - ./
  - ./playground
  - ./docs
  - ./labs/*
  - ./test/fixtures/*
# Nuxt Kit 4.6 deep-clones config classes, breaking Zod schema instances before module setup.
overrides:
  '@nuxt/kit': 4.5.0
  # 1.7.2 is rejected by pnpm trustPolicy; keep the last trusted release.
  seroval: 1.7.1

allowBuilds:
  '@parcel/watcher': true
  better-sqlite3: true
  esbuild: true
  sharp: true
  simple-git-hooks: true
  unrs-resolver: true
  vue-demi: true

onlyBuiltDependencies:
  - '@parcel/watcher'
  - better-sqlite3
  - esbuild

catalog:
  '@antfu/eslint-config': ^10.0.0
  '@antfu/ni': ^30.6.0
  '@cfworker/json-schema': ^4.1.1
  '@env-spec/parser': 0.6.2
  '@nuxt/devtools': ^3.4.1
  '@nuxt/eslint': ^1.17.0
  '@nuxt/eslint-config': ^1.17.0
  '@nuxt/module-builder': ^1.0.3
  '@nuxt/nitro-server': 4.5.0
  '@nuxt/schema': 4.5.0
  '@nuxt/test-utils': ^4.3.4
  '@standard-community/standard-json': ^0.3.7
  '@standard-schema/spec': ^1.1.0
  '@types/node': ^24.19.2
  '@typescript-eslint/parser': ^8.72.0
  '@typescript-eslint/rule-tester': ^8.72.0
  '@typescript-eslint/utils': ^8.72.0
  '@valibot/to-json-schema': 1.8.0
  arktype: ^2.2.9
  better-sqlite3: ^13.0.3
  bumpp: ^12.3.0
  changelogen: ^0.6.2
  consola: ^3.4.2
  defu: ^6.1.7
  docus: ^5.15.0
  eslint: ^10.13.0
  eslint-plugin-format: ^2.0.1
  jiti: ^2.7.0
  lint-staged: ^17.6.0
  magicast: ^0.5.5
  nitro: 3.0.260429-beta
  nuxt: 4.5.0
  ofetch: ^1.5.1
  scule: ^1.3.0
  simple-git-hooks: ^2.14.0
  std-env: ^4.3.0
  typescript: ~6.0.3
  unbuild: ^3.6.1
  valibot: ^1.5.0
  vitest: ^5.0.5
  vue-tsc: ^3.3.13
  zod: ^4.6.7
  zod-to-json-schema: ^3.25.2
